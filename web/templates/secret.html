<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/snake.css') }}" type="text/css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}" type="text/css">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Secret</title>
    <script defer src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/snake.js') }}"></script>
    <script src="{{ url_for('static', filename='js/input.js') }}"></script>
    <script src="{{ url_for('static', filename='js/food.js') }}"></script>
    <script src="{{ url_for('static', filename='js/snakeUtils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
  </head>
  <body>
    <main class="secret-layout">
    <section class="side-text" id="left-text">
      <p>
        在#17-432曾有这样一个话题 <br />
        做游戏，其实很不现实 <br />
        但我记得我曾经的话 <br />
        有些小小的梦只是一个爱好。<br />
      </p>
    </section>
    <section class="game-panel">
      <div class="game-header">
        <a class="home-link" href="{{ url_for('web.index_page') }}">Home</a>
        <div class="score-board" aria-label="游戏数据">
          <span>得分 <strong id="score">0</strong></span>
          <span>坚持 <strong id="survival-time">00:00</strong></span>
          <span>最高分 <strong id="best-score">0</strong></span>
          <span>最佳时间 <strong id="best-time">00:00</strong></span>
        </div>
        <button id="restart-button" type="button">重新开始</button>
      </div>
      <div id="game-board" aria-label="贪吃蛇游戏区域"></div>
      <p id="game-status">方向键控制移动，吃到方块得分。</p>
    </section>
    <section class="side-text" id="right-text">
      <p>
        小小贪吃蛇小游戏 <br />
        ↑键让 Snake 向上 <br />
        ↓键则下<br />
        ←键则左<br />
        →键则右<br />
        R 键或按钮重新开始
      </p>
    </section>
    </main>
  </body>
</html>
